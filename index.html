<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fabrizio — Job Pipeline</title>
<style>
  :root{
    --ink:#1b1b1b; --muted:#5a5a5a; --light:#8c8c8c;
    --accent:#33526e; --accent-soft:#eaf0f6;
    --rule:#e4e6e9; --bg:#f4f5f7; --card:#ffffff;
    --high:#2f6f4f; --high-soft:#e7f2ec;
    --stale:#9a9a9a; --stale-soft:#efefef;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px; margin:0 auto; padding:28px 20px 60px}

  header h1{font-size:22px; margin:0; letter-spacing:.4px}
  header .sub{color:var(--muted); font-size:13px; margin-top:3px}
  header .updated{color:var(--light); font-size:12px; margin-top:6px}
  header .top-row{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap}
  .refresh-btn{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:7px; text-decoration:none;
    background:var(--accent); color:#fff; font-size:13px; font-weight:600;
    padding:9px 14px; border-radius:8px; white-space:nowrap
  }
  .refresh-btn:hover{background:#2a445c}
  .refresh-note{font-size:11px; color:var(--light); margin-top:5px; text-align:right}

  /* pipeline / stats bar */
  .stats{display:flex; gap:10px; margin:18px 0 6px; flex-wrap:wrap}
  .stat{
    flex:1; min-width:120px; background:var(--card); border:1px solid var(--rule);
    border-radius:10px; padding:12px 14px;
  }
  .stat .n{font-size:24px; font-weight:700}
  .stat .l{font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted)}
  .stat.high .n{color:var(--high)}
  .stat.stale .n{color:var(--stale)}

  .bar{height:8px; border-radius:6px; overflow:hidden; display:flex; margin:8px 0 20px; background:var(--rule)}
  .bar span{height:100%}
  .bar .b-new{background:var(--accent)}
  .bar .b-reopened{background:#6b8bab}
  .bar .b-stale{background:var(--stale)}

  /* controls */
  .controls{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:16px}
  .controls input[type=search]{
    flex:1; min-width:180px; padding:9px 12px; border:1px solid var(--rule);
    border-radius:8px; font-size:14px; background:var(--card)
  }
  .chip{
    border:1px solid var(--rule); background:var(--card); color:var(--muted);
    padding:7px 12px; border-radius:999px; font-size:12.5px; cursor:pointer; user-select:none
  }
  .chip.active{background:var(--accent); color:#fff; border-color:var(--accent)}
  .chip.toggle.active{background:var(--high); border-color:var(--high)}

  /* cards */
  .card{
    background:var(--card); border:1px solid var(--rule); border-radius:12px;
    padding:14px 16px; margin-bottom:10px
  }
  .card .top{display:flex; gap:12px; align-items:flex-start; justify-content:space-between}
  .badge{
    flex:0 0 auto; font-weight:700; font-size:13px; padding:4px 9px; border-radius:8px;
    background:var(--accent-soft); color:var(--accent); font-variant-numeric:tabular-nums
  }
  .badge.high{background:var(--high-soft); color:var(--high)}
  .title{font-size:15.5px; font-weight:700; margin:0}
  .org{font-size:13px; color:var(--accent); font-weight:600; margin-top:1px}
  .meta{font-size:12.5px; color:var(--muted); margin-top:4px}
  .meta .dot{color:var(--light); padding:0 6px}
  .flags{margin-top:7px; display:flex; gap:6px; flex-wrap:wrap}
  .flag{font-size:11px; padding:3px 8px; border-radius:6px; background:#f0f1f3; color:var(--muted)}
  .flag.cl{background:var(--high-soft); color:var(--high)}
  .flag.gap{background:#fdf1e7; color:#8a5a2b}
  .status-pill{font-size:11px; padding:2px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.6px}
  .st-new{background:var(--accent-soft); color:var(--accent)}
  .st-reopened{background:#eef3f8; color:#4b6f96}
  .st-stale{background:var(--stale-soft); color:var(--stale)}
  .row-actions{margin-top:10px; display:flex; gap:14px; align-items:center}
  .row-actions a{color:var(--accent); font-size:13px; text-decoration:none; font-weight:600}
  .row-actions a:hover{text-decoration:underline}
  .details-btn{background:none; border:none; color:var(--muted); font-size:12.5px; cursor:pointer; padding:0}
  .details{display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--rule); font-size:12.5px; color:var(--muted)}
  .details.open{display:block}
  .details b{color:var(--ink); font-weight:600}

  .section-h{
    display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
    margin:22px 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:1.6px; color:var(--muted)
  }
  .section-h .caret{transition:transform .15s}
  .section-h.collapsed .caret{transform:rotate(-90deg)}
  .section-h .count{background:var(--rule); color:var(--muted); border-radius:999px; padding:1px 8px; font-size:11px; letter-spacing:0}
  .section-body.collapsed{display:none}

  .empty{background:var(--card); border:1px dashed var(--rule); border-radius:12px; padding:28px; text-align:center; color:var(--muted)}
  .empty code{background:#f0f1f3; padding:2px 6px; border-radius:5px; font-size:12.5px}
  footer{margin-top:30px; color:var(--light); font-size:12px; text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top-row">
      <div>
        <h1>Fabrizio — Job Pipeline</h1>
        <div class="sub">Roles remotos de operaciones / VA / coordinación, puntuados contra tu perfil. Nada se postula solo.</div>
        <div class="updated" id="updated"></div>
      </div>
      <div>
        <a class="refresh-btn" target="_blank" rel="noopener"
           href="https://github.com/fabriziodelucamarocchi/fabrizio-job-pipeline/actions/workflows/daily.yml">
          🔄 Buscar ahora
        </a>
        <div class="refresh-note">abre Actions → "Run workflow"</div>
      </div>
    </div>
  </header>

  <div class="stats" id="stats"></div>
  <div class="bar" id="bar"></div>

  <div class="controls">
    <input type="search" id="search" placeholder="Buscar por puesto o empresa…">
    <span class="chip active" data-filter="all">Todas</span>
    <span class="chip" data-filter="new">Nuevas</span>
    <span class="chip" data-filter="reopened">Reabiertas</span>
    <span class="chip" data-filter="stale">Vencidas</span>
    <span class="chip toggle" data-toggle="high">Solo HIGH</span>
  </div>

  <div id="list"></div>

  <footer>Lee <code>data/jobs.json</code> · se actualiza cuando el workflow commitea el estado.</footer>
</div>

<script>
const HIGH = 50;
let JOBS = [];
let filter = "all", highOnly = false, query = "";
const collapsed = {}; // section collapse state

function fmtDate(s){ return s || "—"; }

async function load(){
  try{
    const r = await fetch("data/jobs.json?_=" + Date.now());
    const data = await r.json();
    JOBS = Object.values(data || {});
  }catch(e){
    JOBS = [];
  }
  render();
}

function computeUpdated(){
  const dates = JOBS.map(j=>j.last_seen).filter(Boolean).sort();
  return dates.length ? dates[dates.length-1] : null;
}

function statCounts(){
  const c = {total:JOBS.length, new:0, reopened:0, stale:0, high:0};
  JOBS.forEach(j=>{
    if(c[j.status]!==undefined) c[j.status]++;
    if((j.score||0)>=HIGH) c.high++;
  });
  return c;
}

function renderStats(){
  const c = statCounts();
  document.getElementById("updated").textContent =
    "Última actualización de datos: " + (computeUpdated() || "sin datos todavía");
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="n">${c.total}</div><div class="l">Seguidas</div></div>
    <div class="stat high"><div class="n">${c.high}</div><div class="l">HIGH match</div></div>
    <div class="stat"><div class="n">${c.new + c.reopened}</div><div class="l">Activas</div></div>
    <div class="stat stale"><div class="n">${c.stale}</div><div class="l">Vencidas</div></div>`;
  const tot = Math.max(c.total,1);
  document.getElementById("bar").innerHTML = `
    <span class="b-new" style="width:${c.new/tot*100}%"></span>
    <span class="b-reopened" style="width:${c.reopened/tot*100}%"></span>
    <span class="b-stale" style="width:${c.stale/tot*100}%"></span>`;
}

function passes(j){
  if(highOnly && (j.score||0)<HIGH) return false;
  if(filter!=="all" && j.status!==filter) return false;
  if(query){
    const hay = ((j.title||"")+" "+(j.company||"")).toLowerCase();
    if(!hay.includes(query)) return false;
  }
  return true;
}

function card(j){
  const high = (j.score||0)>=HIGH;
  const gaps = (j.gaps||[]).length ? `<span class="flag gap">tools: ${j.gaps.join(", ")}</span>` : "";
  const cl = j.cover_letter ? `<span class="flag cl">carta lista</span>` : "";
  const reasons = (j.match_reasons||[]).slice(0,10).join(", ");
  const sal = j.salary ? `<span class="dot">·</span>${j.salary}` : "";
  const loc = j.location ? j.location : "—";
  const id = (j.key||"").replace(/[^a-z0-9]/gi,"_");
  return `
  <div class="card">
    <div class="top">
      <div>
        <p class="title">${j.title||"(sin título)"}</p>
        <div class="org">${j.company||""}</div>
        <div class="meta">${loc}${sal}<span class="dot">·</span><span class="status-pill st-${j.status}">${j.status}</span></div>
        <div class="flags">${cl}${gaps}</div>
      </div>
      <span class="badge ${high?"high":""}">${j.score||0}</span>
    </div>
    <div class="row-actions">
      ${j.url?`<a href="${j.url}" target="_blank" rel="noopener">Abrir postulación ↗</a>`:""}
      <button class="details-btn" onclick="document.getElementById('d_${id}').classList.toggle('open')">detalles ▾</button>
    </div>
    <div class="details" id="d_${id}">
      <div><b>Match:</b> ${reasons||"—"}</div>
      <div><b>Fuente:</b> ${j.source||"—"} &nbsp; <b>Vista primera vez:</b> ${fmtDate(j.first_seen)} &nbsp; <b>Última:</b> ${fmtDate(j.last_seen)}</div>
    </div>
  </div>`;
}

function section(titleTxt, arr){
  if(!arr.length) return "";
  const isCol = !!collapsed[titleTxt];
  return `
  <div class="section-h ${isCol?"collapsed":""}" onclick="toggleSection('${titleTxt}')">
    <span class="caret">▾</span> ${titleTxt} <span class="count">${arr.length}</span>
  </div>
  <div class="section-body ${isCol?"collapsed":""}">
    ${arr.map(card).join("")}
  </div>`;
}

function toggleSection(t){ collapsed[t] = !collapsed[t]; render(); }
window.toggleSection = toggleSection;

function render(){
  renderStats();
  const list = document.getElementById("list");
  if(!JOBS.length){
    list.innerHTML = `<div class="empty">Todavía no hay datos.<br>Corré el workflow (<code>Actions → job-pipeline-daily → Run workflow</code>) y cuando commitee <code>data/jobs.json</code>, recargá esta página.</div>`;
    return;
  }
  const shown = JOBS.filter(passes).sort((a,b)=>(b.score||0)-(a.score||0));
  if(!shown.length){ list.innerHTML = `<div class="empty">No hay resultados para ese filtro.</div>`; return; }

  // group: high & active first, then other active, then stale
  const highActive = shown.filter(j=>j.status!=="stale" && (j.score||0)>=HIGH);
  const otherActive = shown.filter(j=>j.status!=="stale" && (j.score||0)<HIGH);
  const stale = shown.filter(j=>j.status==="stale");

  list.innerHTML =
    section("HIGH · activas", highActive) +
    section("Otras activas", otherActive) +
    section("Vencidas", stale);
}

// wire controls
document.querySelectorAll(".chip[data-filter]").forEach(ch=>{
  ch.onclick = ()=>{
    document.querySelectorAll(".chip[data-filter]").forEach(c=>c.classList.remove("active"));
    ch.classList.add("active"); filter = ch.dataset.filter; render();
  };
});
document.querySelector(".chip[data-toggle=high]").onclick = function(){
  highOnly = !highOnly; this.classList.toggle("active", highOnly); render();
};
document.getElementById("search").addEventListener("input", e=>{ query = e.target.value.toLowerCase().trim(); render(); });

load();
</script>
</body>
</html>
