# Fabrizio De Luca Marocchi - job pipeline config (v4 - molde VA/EA)
profile_path: data/profile.md

# --- Foco: Virtual / Executive Assistant, LATAM, ingles ESCRITO ---
target_titles:
  - virtual assistant
  - executive assistant
  - executive operations assistant
  - administrative assistant
  - remote assistant
  - personal assistant
  - operations assistant
  - asistente virtual
  - asistente ejecutivo
  - asistente administrativo

keywords:
  # nucleo VA/EA
  "virtual assistant": 4
  "executive assistant": 4
  "asistente virtual": 4
  "administrative assistant": 3
  "personal assistant": 3
  assistant: 2
  asistente: 2
  # tareas tipicas de EA/VA
  scheduling: 3
  calendar: 3
  "calendar management": 3
  "inbox management": 3
  email: 2
  documentation: 2
  coordination: 3
  coordinacion: 3
  administrative: 2
  administrativo: 2
  organization: 2
  "data entry": 2
  travel: 1
  # verde: trabajo escrito / async
  "written english": 3
  written: 2
  async: 2
  "asynchronous": 2
  chat: 1
  # herramientas de Fabri
  notion: 2
  "google workspace": 2
  "google calendar": 2
  excel: 1
  spreadsheet: 1
  trello: 1
  slack: 1
  clickup: 1
  asana: 1
  # plus reales
  portuguese: 2
  bilingual: 1
  stable: 1
  reliable: 1
  "fast learner": 1

# Si aparece en el TITULO, se descarta (tech + roles no-VA + señales de mucho telefono)
exclude_titles:
  - engineer
  - ingeniero
  - developer
  - desarrollador
  - programador
  - programmer
  - software
  - "full stack"
  - "full-stack"
  - backend
  - frontend
  - devops
  - "service desk"
  - technician
  - "it support"
  - "help desk"
  - "data scientist"
  - "data engineer"
  - "machine learning"
  - designer
  - disenador
  - architect
  - accountant
  - contador
  - bookkeeper
  - nurse
  - lawyer
  - abogado
  - "sales development"
  - sdr
  - recruiter
  - reclutador
  - "cold caller"
  - "cold calling"
  - "call center"
  - "phone sales"
  - "inside sales"
  - "outbound sales"
  - appointment setter

# Penaliza (no descarta) puestos con mucha carga de voz/telefono -> ingles ESCRITO
penalize_terms:
  "cold call": 25
  "cold calling": 25
  "phone support": 20
  "voice support": 20
  "outbound calls": 20
  "heavy phone": 20
  "make calls": 12
  "phone calls": 12
  "fluent spoken": 15
  "verbal english": 12
  "native english": 10

region_allow:
  - worldwide
  - anywhere
  - global
  - latin america
  - latam
  - south america
  - americas
  - argentina

thresholds:
  min_match: 35
  high_match: 55

