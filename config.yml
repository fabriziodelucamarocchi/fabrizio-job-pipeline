# Fabrizio De Luca Marocchi - job pipeline config (v2)
profile_path: data/profile.md

target_titles:
  - operations coordinator
  - operations assistant
  - project coordinator
  - virtual assistant
  - executive assistant
  - executive operations
  - operations manager
  - administrative
  - project support

# keyword: weight (matched against title + description + tags)
keywords:
  operations: 3
  coordination: 3
  coordinator: 3
  administrative: 2
  workflow: 2
  process: 2
  scheduling: 2
  calendar: 2
  inventory: 2
  supplier: 2
  vendor: 2
  stakeholder: 2
  documentation: 2
  project: 2
  "virtual assistant": 3
  "executive assistant": 3
  notion: 1
  "google workspace": 1
  excel: 1
  spreadsheet: 1
  asana: 1
  slack: 1
  trello: 1
  clickup: 1
  crm: 1
  portuguese: 2
  spanish: 1
  bilingual: 1
  "customer service": 1
  "customer success": 1
  hospitality: 1
  events: 1

# NEW in v2: if ANY of these appear in the job TITLE, the job is dropped.
# This kills the tech/engineering noise (e.g. "Tier III Service Desk Engineer").
exclude_titles:
  - engineer
  - developer
  - programmer
  - software
  - "full stack"
  - "full-stack"
  - backend
  - "back end"
  - frontend
  - "front end"
  - devops
  - "service desk"
  - technician
  - "it support"
  - "help desk"
  - "data scientist"
  - "data engineer"
  - "machine learning"
  - designer
  - architect          # avoids "software architect"; Fabrizio's arch roles are separate
  - accountant
  - bookkeeper
  - nurse
  - lawyer
  - "sales development"
  - sdr
  - recruiter

region_allow:
  - worldwide
  - anywhere
  - global
  - latin america
  - latam
  - south america
  - americas
  - argentina

thresholds:
  min_match: 35      # raised from 22 -> less low-signal noise
  high_match: 55     # raised from 50

tools_watchlist:
  - asana
  - slack
  - hubspot
  - salesforce
  - zendesk
  - intercom
  - looker
  - quickbooks
  - jira
  - monday.com
  - zoom
  - microsoft teams
  - clickup

sources:
  # Generalist aggregators (public JSON).
  remotive_terms:
    - operations
    - virtual assistant
    - project coordinator
    - executive assistant
  remoteok: true

  # NEW in v2: per-company ATS boards (much higher signal, much less tech noise).
  # The slug is the path segment in a job URL:
  #   jobs.ashbyhq.com/<SLUG>/...        -> ashby
  #   boards.greenhouse.io/<SLUG>/...    -> greenhouse
  #   jobs.lever.co/<SLUG>/...           -> lever
  # Add the companies Fabrizio actually targets. A wrong/dead slug is skipped safely.
  ashby:
    - "marcohire"            # from the tracker (Marco)
    - "scale Army Careers"   # from the tracker (Scale Army)
  greenhouse: []             # e.g. ["remote", "gitlab"]  (verify the slug first)
  lever: []                  # e.g. ["someco"]

cover_letters:
  enabled: true
  model: claude-sonnet-5
  max_per_run: 5

digest:
  title: "Fabrizio - Job Pipeline"
  max_items: 25
  stale_after_days: 14
