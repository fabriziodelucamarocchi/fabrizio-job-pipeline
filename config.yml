sources:
  # --- Aggregators (public APIs / RSS) ---
  remotive_terms:
    - operations
    - virtual assistant
    - project coordinator
    - executive assistant
  remoteok: true

  # Jobicy: pulls whole geo buckets, scoring filters afterwards.
  jobicy_geos:
    - latin-america
    - anywhere

  # Himalayas: verified-remote board, searched by keyword.
  himalayas_terms:
    - operations
    - virtual assistant
    - project coordinator
    - executive assistant
    - administrative

  # Get on Board: LATAM-focused, searched in Spanish + English (remote only).
  getonbrd_terms:
    - operaciones
    - asistente virtual
    - coordinador
    - asistente administrativo
    - operations

  # We Work Remotely: category RSS feeds most relevant to ops/VA.
  wwr_feeds:
    - "https://weworkremotely.com/categories/remote-customer-support-jobs.rss"
    - "https://weworkremotely.com/categories/remote-management-and-finance-jobs.rss"

  # --- Per-company ATS boards (add the slugs Fabrizio targets) ---
  ashby:
    - "marcohire"
    - "scale Army Careers"
  greenhouse: []
  lever: []

cover_letters:
  enabled: true
  model: claude-sonnet-5
  max_per_run: 5

digest:
  title: "Fabrizio - Job Pipeline"
  max_items: 25
  stale_after_days: 14
